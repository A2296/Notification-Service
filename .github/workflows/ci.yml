name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only check out and read the code
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm audit --omit=dev --audit-level=high

      - run: npm test
        env:
          TEST_DB_URL: mongodb://localhost:27017/notification_service_test
          JWT_SECRET: ci-test-secret

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t notification-service .
