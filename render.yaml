# Render Blueprint: https://render.com/docs/blueprint-spec
# Render dashboard -> New -> Blueprint -> select this repo. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: notification-service
    runtime: docker
    plan: free
    branch: main
    # GitHub Actions deploys main through the deploy hook once CI passes (docs/DEPLOYMENT.md,
    # "Automatic deploys"), so Render's own auto-deploy is off to avoid deploying twice
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      # MongoDB Atlas connection string (free M0 cluster works)
      - key: DB_CONNECTION_STRING
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      # e.g. https://notification-service.onrender.com (needed for Twilio delivery callbacks)
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      # Shown on the dashboard's Help page (optional): a support address and/or help URL
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        # Render's free plan blocks ports 25, 465 and 587; Brevo and SendGrid also accept 2525
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMS_PROVIDER
        value: console
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
