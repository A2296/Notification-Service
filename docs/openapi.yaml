openapi: 3.0.3
info:
  title: Notification Service API
  version: 1.0.0
  description: |
    A multi-tenant notification platform. Businesses register, create API credentials,
    and send **EMAIL**, **SMS** and **IN_APP** notifications to their own end users.

    ## Getting started
    1. `POST /api/v1/auth/register` to create your business account (returns a dashboard token).
    2. `POST /api/v1/api-keys` with that token to get an **API key + secret** (the secret is shown once).
    3. Call the integration endpoints from your **backend** with the headers
       `X-API-Key` and `X-API-Secret`. Never put the secret in browser or mobile code.

    ## Delivery lifecycle
    `PENDING` → `PROCESSING` → `SENT` (accepted by provider) → `DELIVERED` (confirmed)
    or `FAILED`. Temporary failures are retried automatically with exponential backoff.
    In-app notifications become `DELIVERED` as soon as they are in the recipient's inbox.

    ## Idempotency
    Send an `Idempotency-Key` header when creating a notification. Repeating the request
    with the same key returns the original notification instead of sending twice.
servers:
  - url: /
tags:
  - name: Auth
    description: Business registration and dashboard login
  - name: API Keys
    description: Manage integration credentials (dashboard token only)
  - name: Notifications
    description: Send and track notifications
  - name: Recipients
    description: Your end users and their in-app inboxes
  - name: Admin
    description: Platform operators only (role ADMIN)
  - name: System
    description: Health and provider webhooks

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    ApiSecret:
      type: apiKey
      in: header
      name: X-API-Secret
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ExternalId:
      name: externalId
      in: path
      required: true
      description: Your own ID for this user
      schema: { type: string }

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            success: false
            message: Validation failed
            errors:
              - field: recipient.email
                message: Invalid email address
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not allowed (wrong role or suspended business)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Pagination:
      type: object
      properties:
        currentPage: { type: integer }
        itemsPerPage: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }

    Business:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        createdAt: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        business: { $ref: "#/components/schemas/Business" }

    AuthResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    ApiKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        keyId: { type: string, description: "Public key id, prefixed ns_pk_" }
        secretLast4: { type: string }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Recipient:
      type: object
      properties:
        id: { type: string }
        externalId: { type: string, example: user_123 }
        name: { type: string }
        email: { type: string }
        phone: { type: string, example: "+2348012345678" }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RecipientInput:
      type: object
      required: [externalId]
      properties:
        externalId: { type: string, example: user_123 }
        name: { type: string, example: Ada Lovelace }
        email: { type: string, example: ada@example.com }
        phone: { type: string, example: "+2348012345678" }
        metadata: { type: object, additionalProperties: true }

    NotificationInput:
      type: object
      required: [channel, recipient, message]
      properties:
        channel:
          type: string
          enum: [EMAIL, SMS, IN_APP]
          description: Case-insensitive
        recipient:
          type: object
          description: |
            `id` is your own user ID. If the recipient does not exist yet it is created.
            EMAIL needs `email` (or a stored email for `id`), SMS needs `phone`
            in E.164 format (or a stored phone), IN_APP needs `id`.
          properties:
            id: { type: string, example: user_123 }
            name: { type: string }
            email: { type: string, example: ada@example.com }
            phone: { type: string, example: "+2348012345678" }
        subject:
          type: string
          maxLength: 200
          description: Required for EMAIL
        message:
          type: string
          maxLength: 5000
          description: Max 1600 characters for SMS
        metadata:
          type: object
          additionalProperties: true
          description: Any JSON you want stored with the notification (e.g. orderId)
        scheduledAt:
          type: string
          format: date-time
          description: Send later instead of immediately
      example:
        channel: EMAIL
        recipient:
          id: user_123
          email: ada@example.com
        subject: Your order has shipped
        message: Order #1001 is on its way.
        metadata:
          orderId: "1001"

    NotificationEvent:
      type: object
      properties:
        status: { type: string }
        at: { type: string, format: date-time }
        detail: { type: string }

    Notification:
      type: object
      properties:
        id: { type: string }
        channel: { type: string, enum: [EMAIL, SMS, IN_APP] }
        recipient: { type: string, nullable: true, description: Internal recipient id }
        recipientExternalId: { type: string, nullable: true }
        to: { type: string, description: Resolved email, phone or externalId }
        subject: { type: string }
        message: { type: string }
        metadata: { type: object, additionalProperties: true }
        status: { type: string, enum: [PENDING, PROCESSING, SENT, DELIVERED, FAILED] }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        provider: { type: string, nullable: true }
        providerMessageId: { type: string, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        failedAt: { type: string, format: date-time, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        failureReason: { type: string, nullable: true }
        events:
          type: array
          description: Status history (only on GET by id)
          items: { $ref: "#/components/schemas/NotificationEvent" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NotificationResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        notification: { $ref: "#/components/schemas/Notification" }

    Stats:
      type: object
      properties:
        total: { type: integer }
        byStatus: { type: object, additionalProperties: { type: integer } }
        byChannel: { type: object, additionalProperties: { type: integer } }

security:
  - ApiKey: []
    ApiSecret: []
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Service and database health
      security: []
      responses:
        "200": { description: Healthy }
        "503": { description: Database disconnected }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a business and its first dashboard user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName, name, email, password]
              properties:
                businessName: { type: string, example: Acme Stores }
                name: { type: string, example: Rachael }
                email: { type: string, example: owner@acme.com }
                password: { type: string, minLength: 8, example: Password123 }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { description: Email already registered }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in to the dashboard
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: owner@acme.com }
                password: { type: string, example: Password123 }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current dashboard user and business
      security:
        - BearerAuth: []
      responses:
        "200": { description: Current user }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/api-keys:
    post:
      tags: [API Keys]
      summary: Create an API key and secret
      description: The secret is returned **once**. Store it securely.
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Production server }
      responses:
        "201":
          description: Created
          content:
            application/json:
              example:
                success: true
                message: Store the secret now. It will not be shown again.
                apiKey:
                  id: 66f1c0a2b3c4d5e6f7a8b9c0
                  name: Production server
                  apiKey: "<your-api-key-id>"
                  apiSecret: "<shown-once-store-securely>"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [API Keys]
      summary: List API keys (secrets are never returned)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  apiKeys:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }

  /api/v1/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key (takes effect immediately)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/notifications:
    post:
      tags: [Notifications]
      summary: Send a notification
      description: |
        Returns **202 Accepted** immediately with status `PENDING`; delivery happens in the
        background. Poll `GET /api/v1/notifications/{id}` for the final status.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique key per logical send (e.g. `order-1001-shipped`) to prevent duplicates
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationInput" }
      responses:
        "202":
          description: Accepted for delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationResponse" }
        "200":
          description: Duplicate Idempotency-Key, original notification returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Recipient has no address for this channel }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [Notifications]
      summary: List your notifications
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Matches recipient address, subject or message
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string, enum: [EMAIL, SMS, IN_APP] }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, PROCESSING, SENT, DELIVERED, FAILED] }
        - name: recipientId
          in: query
          description: Your externalId for the recipient
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Notifications (without event history)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /api/v1/notifications/stats:
    get:
      tags: [Notifications]
      summary: Counts by status and channel for your business
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  stats: { $ref: "#/components/schemas/Stats" }

  /api/v1/notifications/{id}:
    get:
      tags: [Notifications]
      summary: Get a notification with its full status history
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark an IN_APP notification as read
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200": { description: Marked as read }
        "400": { description: Not an IN_APP notification }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/notifications/{id}/retry:
    post:
      tags: [Notifications]
      summary: Retry a FAILED notification
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "202": { description: Queued for retry }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Notification is not FAILED }

  /api/v1/recipients:
    post:
      tags: [Recipients]
      summary: Create or update a recipient (upsert by externalId)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipientInput" }
      responses:
        "201": { description: Created }
        "200": { description: Updated }
        "400": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Recipients]
      summary: List recipients
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Recipients
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  recipients:
                    type: array
                    items: { $ref: "#/components/schemas/Recipient" }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /api/v1/recipients/{externalId}:
    get:
      tags: [Recipients]
      summary: Get a recipient
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      responses:
        "200": { description: Recipient }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Recipients]
      summary: Update a recipient's contact details
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string }
                metadata: { type: object, additionalProperties: true }
      responses:
        "200": { description: Updated }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Recipients]
      summary: Delete a recipient's contact details (notification history is kept)
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/recipients/{externalId}/inbox:
    get:
      tags: [Recipients]
      summary: In-app inbox for one of your users
      description: Call from your backend and pass the results to your app.
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: unread
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Inbox
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  unreadCount: { type: integer }
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /api/v1/admin/businesses:
    get:
      tags: [Admin]
      summary: List businesses
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, SUSPENDED] }
      responses:
        "200": { description: Businesses }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/businesses/{id}:
    patch:
      tags: [Admin]
      summary: Suspend or reactivate a business
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, SUSPENDED] }
      responses:
        "200": { description: Updated }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/businesses/{id}/stats:
    get:
      tags: [Admin]
      summary: Notification stats for one business
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Stats }

  /api/v1/admin/notifications:
    get:
      tags: [Admin]
      summary: Notifications across all businesses
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: businessId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string }
      responses:
        "200": { description: Notifications }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/stats:
    get:
      tags: [Admin]
      summary: Platform-wide stats
      security:
        - BearerAuth: []
      responses:
        "200": { description: Stats }

  /api/v1/webhooks/twilio/status:
    post:
      tags: [System]
      summary: Twilio SMS delivery status callback
      description: Called by Twilio, verified with the X-Twilio-Signature header. Not for businesses.
      security: []
      responses:
        "204": { description: Processed }
        "403": { description: Invalid signature }
