openapi: 3.0.3
info:
  title: Notification Service API
  version: 1.0.0
  description: |
    A multi-tenant notification platform. Businesses register, create API credentials,
    and send **EMAIL**, **SMS** and **IN_APP** notifications to their own end users.

    ## Getting started
    1. `POST /api/v1/auth/register` to create your business account (returns a dashboard token).
       Already registered (409)? Use `POST /api/v1/auth/login` to get a token instead.
    2. Click **Authorize**, paste the token under **BearerAuth**, then
       `POST /api/v1/api-keys` to get an **API key + secret** (the secret is shown once).
    3. Click **Authorize** again and enter them under **ApiKey** and **ApiSecret** to call the
       integration endpoints. In your own systems, send the headers `X-API-Key` and
       `X-API-Secret` from your **backend**. Never put the secret in browser or mobile code.

    ## Delivery lifecycle
    `PENDING` → `PROCESSING` → `SENT` (accepted by provider) → `DELIVERED` (confirmed)
    or `FAILED`. Temporary failures are retried automatically with exponential backoff.
    In-app notifications become `DELIVERED` as soon as they are in the recipient's inbox.

    ## Idempotency
    Send an `Idempotency-Key` header when creating a notification. Repeating the request
    with the same key returns the original notification instead of sending twice.
servers:
  - url: /
tags:
  - name: Auth
    description: Business registration and dashboard login
  - name: Account
    description: The signed-in user - profile, password, two-factor authentication, business details
  - name: API Keys
    description: Manage integration credentials (dashboard token only)
  - name: Notifications
    description: Send and track notifications
  - name: Recipients
    description: Your end users and their in-app inboxes
  - name: Schedules
    description: Recurring notifications (daily, weekly or monthly)
  - name: Admin
    description: Platform operators only (role ADMIN)
  - name: System
    description: Health, support contact and provider webhooks

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    ApiSecret:
      type: apiKey
      in: header
      name: X-API-Secret
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token from register/login. HS256, 1 day by default. Stops working after
        `POST /api/v1/auth/logout`.
    SessionCookie:
      type: apiKey
      in: cookie
      name: ns_session
      description: |
        HttpOnly, SameSite=Strict cookie set by register/login and used by the dashboard.
        Requests that change data with this cookie must also send
        `X-Requested-With: XMLHttpRequest` (CSRF protection).

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ExternalId:
      name: externalId
      in: path
      required: true
      description: Your own ID for this user
      schema: { type: string }

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            success: false
            message: Validation failed
            errors:
              - field: recipient.email
                message: Invalid email address
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not allowed (wrong role or suspended business)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
    RateOrMonthlyLimited:
      description: |
        Too many requests this minute, or the plan's **monthly notification limit** is used up.
        The monthly case has `code: MONTHLY_LIMIT_REACHED` and says when the limit resets.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            success: false
            code: MONTHLY_LIMIT_REACHED
            message: "Monthly notification limit reached: the Free plan includes 1,000 notifications per month. It resets on 1 October."

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        code:
          type: string
          description: Machine-readable reason, when there is one (e.g. `MONTHLY_LIMIT_REACHED`)
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Pagination:
      type: object
      properties:
        currentPage: { type: integer }
        itemsPerPage: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }

    Business:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        createdAt: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        business: { $ref: "#/components/schemas/Business" }

    AuthResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    ApiKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        keyId: { type: string, description: "Public key id, prefixed ns_pk_" }
        secretLast4: { type: string }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Recipient:
      type: object
      properties:
        id: { type: string }
        externalId: { type: string, example: user_123 }
        name: { type: string }
        email: { type: string }
        phone: { type: string, example: "+2348012345678" }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RecipientInput:
      type: object
      required: [externalId]
      properties:
        externalId: { type: string, example: user_123 }
        name: { type: string, example: Ada Lovelace }
        email: { type: string, example: ada@example.com }
        phone: { type: string, example: "+2348012345678" }
        metadata: { type: object, additionalProperties: true }

    NotificationInput:
      type: object
      required: [channel, recipient, message]
      properties:
        channel:
          type: string
          enum: [EMAIL, SMS, IN_APP]
          description: Case-insensitive
        recipient:
          type: object
          description: |
            `id` is your own user ID. If the recipient does not exist yet it is created.
            EMAIL needs `email` (or a stored email for `id`), SMS needs `phone`
            in E.164 format (or a stored phone), IN_APP needs `id`.
          properties:
            id: { type: string, example: user_123 }
            name: { type: string }
            email: { type: string, example: ada@example.com }
            phone: { type: string, example: "+2348012345678" }
        subject:
          type: string
          maxLength: 200
          description: Required for EMAIL
        message:
          type: string
          maxLength: 5000
          description: Max 1600 characters for SMS
        metadata:
          type: object
          additionalProperties: true
          description: Any JSON you want stored with the notification (e.g. orderId)
        scheduledAt:
          type: string
          format: date-time
          description: Send later instead of immediately
      example:
        channel: EMAIL
        recipient:
          id: user_123
          email: ada@example.com
        subject: Your order has shipped
        message: Order #1001 is on its way.
        metadata:
          orderId: "1001"

    NotificationEvent:
      type: object
      properties:
        status: { type: string }
        at: { type: string, format: date-time }
        detail: { type: string }

    Notification:
      type: object
      properties:
        id: { type: string }
        channel: { type: string, enum: [EMAIL, SMS, IN_APP] }
        recipient: { type: string, nullable: true, description: Internal recipient id }
        recipientExternalId: { type: string, nullable: true }
        to: { type: string, description: Resolved email, phone or externalId }
        subject: { type: string }
        message: { type: string }
        metadata: { type: object, additionalProperties: true }
        status: { type: string, enum: [PENDING, PROCESSING, SENT, DELIVERED, FAILED] }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        provider: { type: string, nullable: true }
        providerMessageId: { type: string, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        failedAt: { type: string, format: date-time, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        failureReason: { type: string, nullable: true }
        events:
          type: array
          description: Status history (only on GET by id)
          items: { $ref: "#/components/schemas/NotificationEvent" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NotificationResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        notification: { $ref: "#/components/schemas/Notification" }

    Stats:
      type: object
      properties:
        total: { type: integer }
        byStatus: { type: object, additionalProperties: { type: integer } }
        byChannel: { type: object, additionalProperties: { type: integer } }
        inApp:
          type: object
          description: |
            In-app read tracking. `read` counts delivered IN_APP notifications your app has
            marked read (`PATCH /api/v1/notifications/{id}/read`). Email and SMS opens are not tracked.
          properties:
            delivered: { type: integer }
            read: { type: integer }

    Plan:
      type: object
      properties:
        id: { type: string, enum: [FREE, STARTER, PRO] }
        name: { type: string, example: Free }
        description: { type: string }
        monthlyNotifications: { type: integer, example: 1000 }

    Usage:
      type: object
      description: |
        Notifications created this calendar month (UTC) against the plan's limit. Retries and
        repeated (idempotent) requests create nothing new, so they do not count.
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        limit: { type: integer, example: 1000 }
        used: { type: integer, example: 240 }
        remaining: { type: integer, example: 760 }
        periodStart: { type: string, format: date-time }
        resetsAt: { type: string, format: date-time }

security:
  - ApiKey: []
    ApiSecret: []
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Service and database health
      security: []
      responses:
        "200": { description: Healthy }
        "503": { description: Database disconnected }

  /api/v1/support:
    get:
      tags: [System]
      summary: Where to get help with this deployment
      description: |
        Public. Shown on the dashboard's Help page. Each value is `null` when the operator
        has not set it (`SUPPORT_EMAIL`, `SUPPORT_URL`).
      security: []
      responses:
        "200":
          description: Support contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  support:
                    type: object
                    properties:
                      email: { type: string, format: email, nullable: true }
                      url: { type: string, format: uri, nullable: true }

  /api/v1/plans:
    get:
      tags: [System]
      summary: Plans on offer and their monthly notification limits
      description: |
        Public. Every business starts on `FREE`; a platform admin changes a business's plan
        with `PATCH /api/v1/admin/businesses/{id}`. There are no payments.
      security: []
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  plans:
                    type: array
                    items: { $ref: "#/components/schemas/Plan" }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a business and its first dashboard user
      description: Returns a JWT and also sets it as the HttpOnly `ns_session` cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName, name, email, password]
              properties:
                businessName: { type: string, example: Acme Stores }
                name: { type: string, example: Rachael }
                email: { type: string, example: owner@acme.com }
                password: { type: string, minLength: 8, example: Password123 }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { description: Email already registered }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in to the dashboard
      description: |
        Returns a JWT and also sets it as the HttpOnly `ns_session` cookie.

        If two-factor authentication is on, returns `{ "mfaRequired": true, "mfaToken": "..." }`
        instead, with no session. Send the token and a code to `POST /api/v1/auth/login/mfa`
        within 5 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: owner@acme.com }
                password: { type: string, example: Password123 }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/login/mfa:
    post:
      tags: [Auth]
      summary: Finish signing in with a two-factor code
      description: |
        Second step when two-factor authentication is on. `code` is the 6-digit code from the
        authenticator app, or one of the recovery codes. Each code works once; after 5 wrong codes
        the account's code step is locked for 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken, code]
              properties:
                mfaToken: { type: string, description: From the login response }
                code: { type: string, example: "492039" }
      responses:
        "200":
          description: Signed in (same response as a normal login)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { description: "Wrong code, or the sign-in token expired (start again with the password)" }
        "429": { description: Too many wrong codes; try again later }

  /api/v1/account:
    patch:
      tags: [Account]
      summary: Update your name
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "200": { description: Updated user }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/v1/account/password:
    post:
      tags: [Account]
      summary: Change your password
      description: Every other device is signed out; the response carries a fresh session for this one.
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200": { description: Password changed }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Current password is not correct }

  /api/v1/account/mfa/setup:
    post:
      tags: [Account]
      summary: Start two-factor setup
      description: Returns a new secret as text, as an `otpauth://` link and as a QR code (SVG data URL).
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200": { description: "`secret`, `otpauthUrl`, `qrCode`" }
        "401": { description: Password is not correct }
        "409": { description: Two-factor authentication is already on }

  /api/v1/account/mfa/enable:
    post:
      tags: [Account]
      summary: Confirm setup with a first code and turn two-factor on
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { description: "On; `recoveryCodes` (10, shown only this once)" }
        "400": { description: Wrong code or setup not started }

  /api/v1/account/mfa/disable:
    post:
      tags: [Account]
      summary: Turn two-factor off
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, description: Authenticator or recovery code }
      responses:
        "200": { description: "Off" }
        "401": { description: Wrong password or code }

  /api/v1/account/business:
    patch:
      tags: [Account]
      summary: Update your business name (the email sender name) or contact email
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string }
      responses:
        "200": { description: Updated business }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { description: Not a business account }

  /api/v1/account/settings:
    get:
      tags: [Account]
      summary: Delivery channels and limits for your account (no credentials)
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200": { description: "`delivery` (email, sms, inApp: live or logged only) and `limits`" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current dashboard user and business
      security:
        - BearerAuth: []
      responses:
        "200": { description: Current user }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out everywhere
      description: |
        Clears the session cookie and invalidates **every** token issued to this user,
        on all devices. Sign in again to get a new one.
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Cookie used without the X-Requested-With header }

  /api/v1/api-keys:
    post:
      tags: [API Keys]
      summary: Create an API key and secret
      description: The secret is returned **once**. Store it securely.
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Production server }
      responses:
        "201":
          description: Created
          content:
            application/json:
              example:
                success: true
                message: Store the secret now. It will not be shown again.
                apiKey:
                  id: 66f1c0a2b3c4d5e6f7a8b9c0
                  name: Production server
                  apiKey: "<your-api-key-id>"
                  apiSecret: "<shown-once-store-securely>"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The business already has the maximum number of active keys (10 by default) }
    get:
      tags: [API Keys]
      summary: List API keys (secrets are never returned)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  apiKeys:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }

  /api/v1/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key (takes effect immediately)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/notifications:
    post:
      tags: [Notifications]
      summary: Send a notification
      description: |
        Returns **202 Accepted** immediately with status `PENDING`; delivery happens in the
        background. Poll `GET /api/v1/notifications/{id}` for the final status.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique key per logical send (e.g. `order-1001-shipped`) to prevent duplicates
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationInput" }
      responses:
        "202":
          description: Accepted for delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationResponse" }
        "200":
          description: Duplicate Idempotency-Key, original notification returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Recipient has no address for this channel }
        "429": { $ref: "#/components/responses/RateOrMonthlyLimited" }
    get:
      tags: [Notifications]
      summary: List your notifications
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          description: Matches recipient address, subject or message
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string, enum: [EMAIL, SMS, IN_APP] }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, PROCESSING, SENT, DELIVERED, FAILED] }
        - name: recipientId
          in: query
          description: Your externalId for the recipient
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Notifications (without event history)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  /api/v1/notifications/bulk:
    post:
      tags: [Notifications]
      summary: Send up to 100 notifications in one request
      description: |
        Top-level `channel`, `subject`, `message`, `metadata` and `scheduledAt` apply to every
        item; fields set on an item override them. Each item is validated like a single send.

        - Any invalid item → **400**, errors name the item (`notifications.3.recipient.email`),
          and nothing is queued.
        - Otherwise each item is created independently: **202** with per-item `results`.
          An item that cannot be created (e.g. a stored recipient with no address for the
          channel) has an `error` instead of a `notification`. **422** if none could be created.
        - With `Idempotency-Key`, repeating the request returns the original notifications
          (`created: false`) instead of sending twice.
        - Items beyond the plan's monthly limit get an `error` ("Monthly notification limit
          reached…"); the items before them are accepted.

        Bulk requests have their own per-business limit (10 per minute by default).
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notifications]
              properties:
                channel: { type: string, enum: [EMAIL, SMS, IN_APP] }
                subject: { type: string, maxLength: 200 }
                message: { type: string, maxLength: 5000 }
                metadata: { type: object }
                scheduledAt: { type: string, format: date-time }
                notifications:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    description: Same fields as a single notification; overrides the shared fields
            example:
              channel: EMAIL
              subject: We have moved
              message: Our office has a new address.
              notifications:
                - recipient: { email: ada@example.com }
                - recipient: { email: grace@example.com }
                - channel: SMS
                  recipient: { phone: "+2348012345678" }
                  message: We have moved. See our website for the new address.
      responses:
        "202":
          description: Some or all notifications accepted
          content:
            application/json:
              example:
                success: true
                message: 2 accepted, 1 could not be created
                accepted: 2
                failed: 1
                results:
                  - { index: 0, created: true, notification: { id: 66f1c0a2b3c4d5e6f7a8b9c1, status: PENDING } }
                  - { index: 1, created: true, notification: { id: 66f1c0a2b3c4d5e6f7a8b9c2, status: PENDING } }
                  - { index: 2, error: 'Recipient "user_9" has no phone on file. Provide recipient.phone or update the recipient.' }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: None of the notifications could be created (see results) }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/notifications/stats:
