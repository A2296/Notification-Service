# One-command local stack: API + MongoDB + Mailpit (catches real emails locally)
#   docker compose up --build -d
#   docker compose exec api npm run seed:admin   # platform admin (ADMIN_EMAIL/ADMIN_PASSWORD below)
#   API docs:        http://localhost:5000/docs
#   Email inbox UI:  http://localhost:8025
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"

  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_CONNECTION_STRING: mongodb://mongo:27017/notification_service
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: notifications@example.com
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123}
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  mongo-data:
